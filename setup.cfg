[metadata]
name = solix
version = 1.0.0
description = A Python package for labeling solar flare prediction datasets
long_description = file: README.md
long_description_content_type = text/markdown
author = Assem Kadirova
license = GPL-3.0-or-later
license_files = LICENSE
url = https://github.com/assemkdv/solix
project_urls =
    Source = https://github.com/assemkdv/solix
    Issues = https://github.com/assemkdv/solix/issues
python_requires = >=3.10
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Science/Research
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Topic :: Scientific/Engineering :: Astronomy

[options]
package_dir =
    = src
packages = find:
install_requires =
    pandas>=2.0
    numpy

[options.packages.find]
where = src

[options.extras_require]
dev =
    pytest
pytorch-examples =
    torch
    pillow
    astropy
tensorflow-examples =
    tensorflow
    pillow
    astropy
